name: Local app checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned uv
        run: python -m pip install uv==0.13.1
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Python lint
        run: uv run --locked ruff check .
      - name: Python formatting
        run: uv run --locked ruff format --check .
      - name: Generated-fixture tests and end-to-end smoke
        run: uv run --locked python -m pytest -q
      - name: Locked frontend setup
        run: npm --prefix frontend ci
      - name: Frontend formatting
        run: npm --prefix frontend run format:check
      - name: Strict frontend production build
        run: npm --prefix frontend run build

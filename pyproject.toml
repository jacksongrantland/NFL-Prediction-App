[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl-prediction"
version = "0.1.0"
description = "Local NFL prediction application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "typer",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "duckdb>=1.5.6",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "tzdata>=2026.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
nfl = "nfl_prediction.cli:app"

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

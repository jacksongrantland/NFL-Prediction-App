[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl-prediction"
version = "0.1.0"
description = "Local NFL prediction application"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "typer"]

[project.scripts]
nfl = "nfl_prediction.cli:app"

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
